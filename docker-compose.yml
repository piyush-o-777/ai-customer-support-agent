services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-support-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: ai-support-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
